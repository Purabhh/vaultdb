[project]
name = "vaultdb"
version = "0.2.0"
description = "Desktop knowledge base and MCP server: Obsidian vaults as a local hybrid search index"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "numpy>=2.4.6",
    "platformdirs>=4.13.5",
    "pywebview>=6.2.1",
    "watchdog>=6.0.0",
]

[project.scripts]
vaultdb = "vaultdb.app:main"
vaultdb-mcp = "vaultdb.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vaultdb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ollama: needs a running Ollama at http://localhost:11434"]

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
]
